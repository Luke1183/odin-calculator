<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script defer src="script.js"></script>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="calculator-container">
    <h1>Calculator</h1>
    <div id="display-and-input-container">
        <div id="display"></div>
        <div id="row1">
        <button id="clear">Clear (c)</button>
        <button id="delete">Delete</button>
        </div>
        <div id="row2">
        <button id="dig7">7</button>
        <button id="dig8">8</button>
        <button id="dig9">9</button>
        <button id="opDiv">/</button>
        </div>
        <div id="row3">
        <button id="dig4">4</button>
        <button id="dig5">5</button>
        <button id="dig6">6</button>
        <button id="opMult">*</button>
        </div>
        <div id="row4">
        <button id="dig1">1</button>
        <button id="dig2">2</button>
        <button id="dig3">3</button>
        <button id="opNeg">-</button>
        </div>
        <div id="row5">
        <button id="equals">=</button>
        <button id="dig0">0</button>
        <button id="dec">.</button>
        <button id="opPlus">+</button>
        </div>
    </div>
    </div>
</body>
</html>
